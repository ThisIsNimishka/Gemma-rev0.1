metadata:
  game_name: My Game
  version: '1.0'
  created_with: Katana Workflow Builder
  created_date: '2026-02-02 14:06:08'
  path: C:\users\Administrator\AppData\Local\Programs\LM Studio\LM Studio.exe
  benchmark_duration: 120
  startup_wait: 30
  resolution: 1920x1080
  preset: High
  graphics_api: DirectX 11
steps:
  1:
    description: Click on Model Finder icon
    find:
      type: icon
      text: Accessibility
      text_match: contains
    action:
      type: hotkey
      keys:
      - ctrl
      - shift
      - m
    expected_delay: 2
    timeout: 20
  2:
    description: Input Model Text
    find:
      type: icon
      text: Search local models by name or author....
      text_match: contains
    action:
      type: text
      text: TheBloke/phi-2-GGUF
      clear_first: false
      char_delay: 0.05
    verify_success:
    - type: icon
      text: TheBloke
      text_match: contains
    expected_delay: 4
    timeout: 20
  3:
    description: Click on the down button
    find:
      type: icon
      text: Go to next
      text_match: contains
    action:
      type: click
      button: left
      move_duration: 0.3
      click_delay: 0.2
    expected_delay: 2
    timeout: 20
  4:
    description: Click on Download Button
    find:
      type: icon
      text: Download 1.93 GB
      text_match: exact
    action:
      type: click
      button: left
      move_duration: 0.3
      click_delay: 0.2
    expected_delay: 2
    timeout: 20
fallbacks:
  general:
    action: key
    key: escape
    expected_delay: 1
